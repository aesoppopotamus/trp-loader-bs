<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRP Loading Screen</title>
  
  <!-- Bootstrap CSS (from CDN) -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <canvas id="snow" class="snow-layer"></canvas>
  <div id="loading-wrapper">
  <div id="boot-seq" class="startseq startseq--visible" aria-hidden="true"></div>
  <div class="holo-scanlines"></div>
  <!-- Top Right Container for Logo and Headers -->
  <div id="top-right">
  </div>

  <!-- Assembly Feed Left Column -->
  <div class="assembly-feed-container-left">
    <!-- DOS / 386 boot screen -->
  <div id="dos-screen" class="crt">
  <div id="boot-feed" class="terminal"></div>
  </div>
  </div>

  <!-- MAP (centeredcontent) -->
<div id="map-block">

  <svg id="map-svg" viewBox="0 0 1800 1170" preserveAspectRatio="xMidYMid meet">
    <image id="map-image" href="img/washingtonmap2.png" x="0" y="0" width="1800" height="1170"
           preserveAspectRatio="xMidYMid meet" />
  </svg>
<div id="tacmap-ticker" aria-live="polite"></div>

</div>

  <!-- New diagnostics block -->
  <div id="diag-block">
  <svg id="diag-pane"></svg>
  </div>



  <!-- Console Element (for terminal-style text) -->
  <div id="console">
    <span id="console-prompt">&gt; </span> <!-- This part is constant -->
    <span id="console-text"></span> <!-- Dynamic text will appear here -->
    <span id="cursor">|</span> <!-- Cursor -->
  </div>

  <!-- Music Button and Audio Element -->
  <button id="play-music">Start Music (browser-override)</button>
  <audio id="background-music" src="audio/futurewarambiance.mp3" loop></audio>

    <!-- Scanlines effect -->
  <div class="scanlines"></div>
    
  </div> <!-- End of loading-wrapper -->
  
  <!-- Custom Scripts -->
<script defer src="js/config.js"></script>
<script defer src="js/loading.js"></script>
<script defer src="js/startsequence.js"></script>
<script defer src="js/tacmap.nodes.js"></script>
<script defer src="js/tacmap.ticker.js"></script>
<script defer src="js/diag.js"></script>
<script defer src="js/dosBoot.js"></script>
<script defer src="js/cursorTyper.js"></script>
<script defer src="js/snow.js"></script>

</body>

</html>
